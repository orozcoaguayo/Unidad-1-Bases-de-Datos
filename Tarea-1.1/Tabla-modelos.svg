<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 590" width="1520" height="590" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1520" height="590" fill="#ffffff"/>
<text x="10.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="start">Tabla comparativa de los modelos de bases de datos</text>
<rect x="10.0" y="56.0" width="1500.0" height="46.0" rx="6" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/>
<text x="22.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="start">Modelo</text>
<text x="212.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="start">Definición</text>
<text x="732.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="start">Forma de representación de los datos</text>
<text x="1292.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="start">Ejemplos de SGBD</text>
<rect x="10.0" y="102.0" width="190.0" height="86.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="200.0" y="102.0" width="520.0" height="86.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="720.0" y="102.0" width="560.0" height="86.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="1280.0" y="102.0" width="230.0" height="86.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="10.0" y="102.0" width="7.0" height="86.0" rx="0" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="24.0" y="129.4" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="start">Jerárquico</text>
<text x="214.0" y="127.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Organiza los datos en una estructura de árbol con una raíz: cada registro</text>
<text x="214.0" y="147.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">padre puede tener varios hijos, pero cada hijo tiene un único padre</text>
<text x="214.0" y="167.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">(relaciones 1:N).</text>
<text x="734.0" y="127.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Segmentos o registros enlazados mediante punteros en niveles; se consulta</text>
<text x="734.0" y="147.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">recorriendo el árbol desde la raíz hacia las hojas.</text>
<text x="1294.0" y="127.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">IBM IMS</text>
<rect x="10.0" y="188.0" width="190.0" height="66.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="200.0" y="188.0" width="520.0" height="66.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="720.0" y="188.0" width="560.0" height="66.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="1280.0" y="188.0" width="230.0" height="66.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="10.0" y="188.0" width="7.0" height="66.0" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/>
<text x="24.0" y="215.4" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#7c3aed" text-anchor="start">Red</text>
<text x="214.0" y="213.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Amplía el modelo jerárquico: un registro hijo puede tener varios padres,</text>
<text x="214.0" y="233.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">formando un grafo que permite relaciones N:M mediante conjuntos (sets).</text>
<text x="734.0" y="213.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Registros (nodos) y conjuntos propietario-miembro enlazados con punteros; la</text>
<text x="734.0" y="233.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">consulta se hace navegando de registro en registro (estilo CODASYL).</text>
<text x="1294.0" y="213.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">IDMS, Integrity</text>
<rect x="10.0" y="254.0" width="190.0" height="86.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="200.0" y="254.0" width="520.0" height="86.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="720.0" y="254.0" width="560.0" height="86.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="1280.0" y="254.0" width="230.0" height="86.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="10.0" y="254.0" width="7.0" height="86.0" rx="0" fill="#059669" stroke="#059669" stroke-width="0"/>
<text x="24.0" y="281.4" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#059669" text-anchor="start">Relacional</text>
<text x="214.0" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Se basa en la teoría de conjuntos y la lógica de predicados (Codd, 1970):</text>
<text x="214.0" y="299.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">los datos se agrupan en relaciones independientes de su almacenamiento</text>
<text x="214.0" y="319.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">físico.</text>
<text x="734.0" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Tablas con filas (tuplas) y columnas (atributos); las relaciones se establecen con</text>
<text x="734.0" y="299.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">claves primarias y foráneas y se consulta con SQL.</text>
<text x="1294.0" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">MySQL, PostgreSQL, Oracle,</text>
<text x="1294.0" y="299.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">SQL Server</text>
<rect x="10.0" y="340.0" width="190.0" height="86.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="200.0" y="340.0" width="520.0" height="86.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="720.0" y="340.0" width="560.0" height="86.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="1280.0" y="340.0" width="230.0" height="86.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="10.0" y="340.0" width="7.0" height="86.0" rx="0" fill="#d97706" stroke="#d97706" stroke-width="0"/>
<text x="24.0" y="367.4" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#d97706" text-anchor="start">Orientado a objetos</text>
<text x="214.0" y="365.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Almacena la información como objetos, con atributos y métodos,</text>
<text x="214.0" y="385.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">integrando los conceptos de la programación orientada a objetos: clases,</text>
<text x="214.0" y="405.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">herencia, encapsulamiento y polimorfismo.</text>
<text x="734.0" y="365.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Objetos con identidad única (OID) agrupados en clases; las relaciones son</text>
<text x="734.0" y="385.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">referencias entre objetos y jerarquías de herencia.</text>
<text x="1294.0" y="365.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">db4o, ObjectDB</text>
<rect x="10.0" y="426.0" width="190.0" height="66.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="200.0" y="426.0" width="520.0" height="66.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="720.0" y="426.0" width="560.0" height="66.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="1280.0" y="426.0" width="230.0" height="66.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="10.0" y="426.0" width="7.0" height="66.0" rx="0" fill="#db2777" stroke="#db2777" stroke-width="0"/>
<text x="24.0" y="453.4" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#db2777" text-anchor="start">Objeto-relacional</text>
<text x="214.0" y="451.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Extiende el modelo relacional con características de objetos: tipos</text>
<text x="214.0" y="471.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">definidos por el usuario, herencia entre tablas y colecciones.</text>
<text x="734.0" y="451.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Tablas cuyas columnas pueden contener tipos complejos, objetos o colecciones</text>
<text x="734.0" y="471.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">anidadas; se consulta con SQL extendido.</text>
<text x="1294.0" y="451.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">PostgreSQL, Oracle Database</text>
<rect x="10.0" y="492.0" width="190.0" height="86.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="200.0" y="492.0" width="520.0" height="86.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="720.0" y="492.0" width="560.0" height="86.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="1280.0" y="492.0" width="230.0" height="86.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="10.0" y="492.0" width="7.0" height="86.0" rx="0" fill="#0891b2" stroke="#0891b2" stroke-width="0"/>
<text x="24.0" y="519.5" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0891b2" text-anchor="start">NoSQL</text>
<text x="214.0" y="517.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Agrupa modelos no relacionales pensados para grandes volúmenes de</text>
<text x="214.0" y="537.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">datos, variedad de formatos y escalabilidad horizontal, con esquemas</text>
<text x="214.0" y="557.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">flexibles.</text>
<text x="734.0" y="517.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Según el subtipo: documentos (JSON/BSON), pares clave-valor, familias de</text>
<text x="734.0" y="537.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">columnas o grafos (nodos y aristas).</text>
<text x="1294.0" y="517.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">MongoDB, Redis, Cassandra,</text>
<text x="1294.0" y="537.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Neo4j</text>
</svg>